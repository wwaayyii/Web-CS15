name: Deploy pull request preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webcs15-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pr-${{ github.event.pull_request.number }}/
    steps:
      # pull_request_target supplies the trusted workflow and write-capable token.
      # The PR checkout is treated only as static data: no PR script is executed.
      - name: Check out trusted publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher

      - name: Check out PR files as untrusted static data
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false

      - name: Assemble Pages site
        working-directory: publisher
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add publish origin/gh-pages
          preview_dir="publish/pr-${PR_NUMBER}"
          rm -rf -- "${preview_dir}"

          if [[ "${PR_ACTION}" != "closed" ]]; then
            mkdir -p "${preview_dir}"
            git -C ../source archive HEAD | tar -x -C "${preview_dir}"
          fi

          touch publish/.nojekyll
          git -C publish config user.name github-actions[bot]
          git -C publish config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C publish add --all
          git -C publish commit -m "${PR_ACTION} preview PR #${PR_NUMBER} at ${PR_SHA}" || true
          git -C publish push origin HEAD:gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload assembled Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publisher/publish

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
